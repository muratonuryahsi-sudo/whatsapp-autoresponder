<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="metal-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d1d1d6"/>
      <stop offset="100%" stop-color="#636366"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="#000000" rx="22"/>

  <!-- Minimalist angled stem -->
  <line x1="30" y1="78" x2="52" y2="48" stroke="url(#metal-silver)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Faceted leaf polygon 1 (Left) -->
  <polygon points="50,50 36,44 42,32 54,42" fill="none" stroke="url(#metal-silver)" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Faceted leaf polygon 2 (Center High) -->
  <polygon points="52,44 48,26 62,20 64,36" fill="none" stroke="#2997ff" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Faceted leaf polygon 3 (Right) -->
  <polygon points="56,46 72,40 76,52 62,56" fill="none" stroke="url(#metal-silver)" stroke-width="2" stroke-linejoin="round"/>
</svg>
