<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <filter id="emerald-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#30d158" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#000000" rx="22"/>
  
  <g filter="url(#emerald-glow)">
    <!-- Organic golden-ratio parsley curves -->
    <path d="M50 80 Q50 62 50 50" stroke="#30d158" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    
    <!-- Outer delicate silhouette -->
    <path d="M50 50 
             C42 46 34 42 30 34 
             C27 28 32 24 37 27 
             C39 22 45 22 47 28 
             C48 24 52 24 53 28 
             C55 22 61 22 63 27 
             C68 24 73 28 70 34 
             C66 42 58 46 50 50 Z" 
          fill="#1c1c1e" 
          stroke="#30d158" 
          stroke-width="2" 
          stroke-linejoin="round"/>

    <!-- Inner subtle vein lines -->
    <line x1="50" y1="50" x2="50" y2="30" stroke="#30d158" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
    <line x1="50" y1="42" x2="40" y2="35" stroke="#30d158" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <line x1="50" y1="42" x2="60" y2="35" stroke="#30d158" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
